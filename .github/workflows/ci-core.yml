name: Core CI

on:
  push:
    branches: [main]
    paths: &paths
      - '**'
      - '!**/*.md'
      - '**/testdata/**'
      - '!confidential/**'
      - '!docs/**'
      - '!.agents/**'
      - '!.claude/**'
      - '!.ai-review/**'
      - '!.github/**'
      - '.github/workflows/ci-core.yml'
      - '.github/workflows/ci-tests.yml'
      - '.github/workflows/ci-checks.yml'
      - '.github/workflows/ci-api-compatibility.yml'
  pull_request:
    branches: ['**']
    # API acknowledgements can change with the PR title or description.
    types: [opened, synchronize, reopened, edited]
    paths: *paths
  schedule:
    # Scan for newly disclosed CVEs even when no code changes.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    if: github.event_name != 'schedule' && github.event.action != 'edited'
    uses: ./.github/workflows/ci-tests.yml
    with:
      module: core

  checks:
    if: github.event.action != 'edited'
    uses: ./.github/workflows/ci-checks.yml
    with:
      module: core

  api-compatibility:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci-api-compatibility.yml
    with:
      module: core
