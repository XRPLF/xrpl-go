name: Core API Compatibility

# Breaking exported API changes are acknowledged with a "!" in the PR title, so this
# workflow re-runs on every title or description edit. It is separate from core
# CI so that an edit re-checks only this and leaves the test and lint checks on the
# commit as the last code push left them.

on:
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, edited]
    paths:
      - '**'
      - '!**/*.md'
      - '**/testdata/**'
      - '!confidential/**'
      - '!docs/**'
      - '!.agents/**'
      - '!.claude/**'
      - '!.ai-review/**'
      - '!.github/**'
      - '.github/workflows/ci-api-compatibility.yml'
      - '.github/workflows/ci-api-compatibility-core.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-compatibility:
    uses: ./.github/workflows/ci-api-compatibility.yml
    with:
      module: core
