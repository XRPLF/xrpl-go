name: Confidential CI

on:
  push:
    branches: [main]
    paths: &paths
      - 'confidential/**'
      - '!confidential/**/*.md'
      - 'confidential/**/testdata/**'
      - 'pkg/mptsizes/**'
      - '!pkg/mptsizes/**/*.md'
      - 'pkg/mptsizes/**/testdata/**'
      - 'Makefile'
      - '.golangci.yml'
      - '.ci-config/**'
      - 'scripts/localnet-integration.sh'
      - 'scripts/summarize-go-test-report.sh'
      - 'scripts/report-api-compatibility.sh'
      - '.github/workflows/ci-confidential.yml'
      - '.github/workflows/ci-tests.yml'
      - '.github/workflows/ci-checks.yml'
      - '.github/workflows/ci-cgo-matrix.yml'
      - '.github/workflows/update-mpt-crypto.yml'
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]
    paths: *paths
  schedule:
    # Scan for newly disclosed CVEs even when no code changes.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/ci-tests.yml
    with:
      module: confidential

  native-tests:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/ci-cgo-matrix.yml

  checks:
    uses: ./.github/workflows/ci-checks.yml
    with:
      module: confidential
