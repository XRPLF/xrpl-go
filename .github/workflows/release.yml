name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Use vX.Y.Z for stable, or add a suffix such as -rc1, -beta1, or -b1 for prerelease
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $semver_pattern ]]; then
            echo "Release tag must use vX.Y.Z or vX.Y.Z-prerelease format: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create release notes from changelog
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          awk -v heading="## [$RELEASE_TAG]" '
            $0 == heading { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no release notes under ## [$RELEASE_TAG]" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          release_arguments=(
            "$RELEASE_TAG"
            --target "$TARGET_SHA"
            --title "$RELEASE_TAG"
            --notes-file release-notes.md
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_arguments+=(--prerelease)
          fi

          gh release create "${release_arguments[@]}"
